<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Safe 最简本地工具</title>

<!-- GitHub Pages 场景下的 CSP（只允许本域脚本；不依赖外部 CDN） -->
<meta http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        base-uri 'none';
        object-src 'none';
        script-src 'self';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data:;
        connect-src 'self' https: wss:;
        frame-ancestors 'none';
        form-action 'self'">

<meta name="referrer" content="no-referrer" />

<!-- 自托管 ethers（UMD，挂到 window.ethers） -->
<script src="vendor/ethers-5.7.2.umd.min.js"></script>
<!-- 你的应用脚本（ESM 模块） -->
<script type="module" src="js/app.js"></script>

<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:24px;line-height:1.4;}
  h1{font-size:20px;margin:0 0 12px;}
  fieldset{border:1px solid #ddd;border-radius:8px;margin:12px 0;padding:12px;}
  label{display:block;margin:8px 0 4px;font-size:13px;color:#333}
  input,textarea{width:100%;padding:8px;border:1px solid #ccc;border-radius:6px;font-family:monospace}
  button{padding:8px 12px;border:0;border-radius:6px;background:#111;color:#fff;cursor:pointer;margin:6px 6px 0 0}
  button.secondary{background:#555}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .hint{font-size:12px;color:#666}
  .ok{color:#0a7f1f}
  .err{color:#b00020;white-space:pre-wrap}
  #log{white-space:pre-wrap;background:#fafafa;border:1px dashed #ccc;padding:10px;border-radius:6px;margin-top:8px}
  small.code{font-family:monospace;background:#f2f2f2;border-radius:4px;padding:0 4px}

  /* 关键值：等宽、大字、强对比；确认后改为绿色底边框 */
  .critical-input{
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    font-size: 16px;
    letter-spacing: .3px;
    background: #fffbe6;          /* 未确认：淡黄提醒 */
    border: 2px solid #111;       /* 粗边框提高辨识 */
    color: #111;
  }
  .critical-input.confirmed{
    background: #e6fff2;          /* 已确认：淡绿 */
    border-color: #0a7f1f;
  }

  /* 状态文案：未确认/已确认 */
  .status-warn{ color:#b00020; }
  .status-ok{ color:#0a7f1f; }

  /* 让日志面板吸顶，始终可见 */
  #logPanel {
    position: sticky;
    top: 0;
    z-index: 1000;
    background: #fff;
    box-shadow: 0 2px 0 rgba(0,0,0,0.04);
    margin-bottom: 8px;   /* 让下面内容不被贴住 */
  }

  #log {
    max-height: 200px;    /* 调成你喜欢的高度 */
    overflow: auto;       /* 超出后内部滚动 */
    white-space: pre-wrap;
    background: #fafafa;
    border: 1px dashed #ccc;
    padding: 10px;
    border-radius: 6px;
    margin-top: 8px;
  }


</style>
</head>
<body>
  <h1>Safe 最简本地工具（MetaMask / 硬件钱包）</h1>

  <!-- ✅ 日志：放在标题下方，并设置 id="logPanel" 以启用 sticky 吸顶 -->
  <fieldset id="logPanel">
    <legend>日志</legend>
    <div id="log"></div>
  </fieldset>

  <!-- ✅ 新增：网络（插在这里） -->
  <fieldset>
    <legend>网络</legend>
    <div class="row">
      <div>
        <label>选择网络</label>
        <select id="netSelect">
          <option value="arbitrum">Arbitrum One (42161)</option>
          <option value="ethereum">Ethereum Mainnet (1)</option>
          <option value="bsc">BNB Smart Chain (56)</option>
        </select>
      </div>
      <div>
        <label class="hint">说明</label>
        <div class="hint">切换后请填写该链上的 Safe 地址</div>
      </div>
    </div>
    <button id="btnSwitch" class="secondary">切换网络</button>
  </fieldset>

  <!-- ✅ 新增：连接（插在这里） -->
  <fieldset>
  <legend>连接</legend>
  <div class="row">
    <div>
      <label>Safe 地址（你的 Safe 代理合约）</label>
      <input id="safe" placeholder="0xYourSafeAddress" />
    </div>
    <div>
      <label>当前链信息</label>
      <input id="chain" disabled />
    </div>
  </div>

  <button id="btnConnect">连接钱包</button>
  <button id="btnDisconnect" class="secondary">断开钱包</button>
  <button id="btnSwitchAccount" class="secondary">切换账号</button>
  <button id="btnBindSafe" class="secondary">绑定合约</button>

  <span id="acct" class="hint"></span>
</fieldset>


  <fieldset>
    <legend>读取配置</legend>
    <div class="row">
      <div>
        <label>阈值（getThreshold）</label>
        <input id="threshold" disabled />
      </div>
      <div>
        <label>nonce()</label>
        <input id="nonce" placeholder="留空则自动读取" readonly />
      </div>
    </div>
    <button class="secondary" id="btnRead">读取 threshold / nonce</button>
  </fieldset>

  <fieldset>
  <legend>转账参数（转原生 ETH 默认即可）</legend>

  <div class="row">
    <!-- 收款地址 + 确认 -->
    <div>
      <label>收款地址（to）</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="to" class="critical-input" placeholder="0xReceiver" style="flex:1" />
        <button id="btnConfirmTo" class="secondary">确认地址</button>
      </div>
      <div id="toStatus" class="hint status-warn">请填写后点击“确认地址”，未确认将无法计算/执行</div>
    </div>

    <!-- 金额 + 确认 -->
    <div>
      <label id="amountLabel">Amount (ETH)（自动换算为 wei）</label>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="amountEth" class="critical-input" placeholder="0.00002" style="flex:1" />
        <button id="btnConfirmAmount" class="secondary">确认金额</button>
      </div>
      <div id="amountStatus" class="hint status-warn">请填写后点击“确认金额”，未确认将无法计算/执行</div>
    </div>
  </div>

  <div class="row">
    <div>
      <label>data（转原生 ETH 填 <small class="code">0x</small>）</label>
      <input id="data" value="0x" />
    </div>
    <div>
      <label>operation</label>
      <input id="operation" value="0" readonly />
    </div>
  </div>
  <div class="row">
    <div><label>safeTxGas</label><input id="safeTxGas" value="0" readonly /></div>
    <div><label>baseGas</label><input id="baseGas" value="0" readonly /></div>
  </div>
  <div class="row">
    <div><label>gasPrice</label><input id="gasPrice" value="0" readonly /></div>
    <div><label>gasToken</label><input id="gasToken" value="0x0000000000000000000000000000000000000000" readonly /></div>
  </div>
  <div class="row">
    <div><label>refundReceiver</label><input id="refundReceiver" value="0x0000000000000000000000000000000000000000" readonly /></div>
    <div><label>safeTxHash（自动计算）</label><input id="safeTxHash" disabled /></div>
  </div>

  <!-- 高级参数锁/解锁按钮在“计算”上方 -->
  <button id="btnToggleAdvanced" class="secondary">解锁高级参数</button>
  <button class="secondary" id="btnHash">计算 safeTxHash</button>
</fieldset>


  <!-- ✅ 新增：批准（插在这里） -->
  <fieldset>
    <legend>批准（每位 Owner 都要点一次）</legend>
    <p class="hint">确保当前连接的钱包就是某位 Owner。这个操作会发链上交易。</p>
    <button id="btnApprove">approveHash(safeTxHash)</button>

    <!-- ✅ 新增：批准状态 -->
    <div class="row" style="margin-top:8px">
      <div>
        <button id="btnRefreshApprovals" class="secondary">刷新批准状态</button>
      </div>
      <div>
        <span id="approvalSummary" class="hint"></span>
      </div>
    </div>
    <textarea id="approvalsBox" rows="4" readonly class="hint" style="width:100%;margin-top:6px;font-family:monospace"></textarea>
  </fieldset>

  <!-- ✅ 新增：共享 / 导入（插在这里） -->
  <fieldset>
  <legend>共享 / 导入（第二人用）</legend>

  <div class="row">
    <div>
      <label>分享字符串（复制给第二人）</label>
      <textarea id="shareStr" rows="4" readonly placeholder="点击生成 → 可复制或做深链/文件"></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
        <button id="btnBuildShare" class="secondary">生成分享字符串</button>
        <button id="btnCopyShare" class="secondary">复制字符串</button>
        <button id="btnMakeLink" class="secondary">复制深链</button>
        <button id="btnDownloadShare" class="secondary">下载 JSON 文件</button>
      </div>
      <div id="shareInfo" class="hint" style="margin-top:6px"></div>
    </div>

    <div>
      <label>导入字符串（第二人在任意机器粘贴）</label>
      <textarea id="importStr" rows="4" placeholder="粘贴 SAFE1.xxxxx"></textarea>
      <div style="display:flex;gap:8px;margin-top:6px;flex-wrap:wrap">
        <button id="btnImportStr" class="secondary">解析并填充</button>
      </div>
      <div class="hint">解析后会自动切链、填充参数、并校验 safeTxHash</div>
    </div>
  </div>
</fieldset>


  <!-- ✅ 新增：预验证（插在这里） -->
  <fieldset>
  <legend>生成“预验证 signatures”并执行</legend>

  <!-- 手动（保留，可选） -->
  <label>Owner 地址列表（逗号分隔；至少达到阈值个）</label>
  <input id="owners" placeholder="0xOwner1,0xOwner2" />
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="secondary" id="btnSig">手动生成 signatures</button>
    <!-- ✅ 新增：自动 -->
    <button class="secondary" id="btnAutoSig">根据批准状态生成 signatures</button>
  </div>

  <textarea id="signatures" rows="3" placeholder="自动生成" readonly style="margin-top:8px"></textarea>
  <p class="hint">提示：每个 Owner 65 字节；2 人应为 262 个字符（含 0x）。</p>

  <button id="btnExec">execTransaction（payable amount 固定 0）</button>
</fieldset>


</body>
</html>
